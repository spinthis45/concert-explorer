<style>
  :root{
    --bg:#131009;
    --bg-alt:#1b160e;
    --bg-raised:#241d12;
    --line:#3c3220;
    --line-soft:#2a2315;
    --ink:#f2e9d6;
    --ink-dim:#b9ac91;
    --ink-mute:#8c8068;
    --paper:#f3ead4;
    --paper-2:#e9dcc0;
    --paper-ink:#231c11;
    --paper-ink-dim:#5c5240;
    --accent:#d94f2b;
    --accent-ink:#fff6ea;
    --gold:#c99a3d;
    --gold-ink:#221a08;
    --focus:#e8b23d;
    --status-locked:#d94f2b;
    --status-confirmed:#7c9a4a;
    --status-tentative:#8c8068;
    --radius:12px;
    --mono:'Space Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --display:'Anton', Impact, 'Arial Narrow', sans-serif;
    --body:'Archivo', system-ui, -apple-system, sans-serif;
    color-scheme: dark;
  }
  *{ box-sizing:border-box; }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; }
  }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--body);
    font-size:15px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  a{ color:inherit; }
  button{ font-family:inherit; }
  ::selection{ background:var(--accent); color:var(--accent-ink); }
  .tabular{ font-variant-numeric:tabular-nums; }

  /* ---------- shell ---------- */
  .shell{
    max-width:1180px;
    margin:0 auto;
    padding:0 20px calc(48px + env(safe-area-inset-bottom,0px));
  }

  /* ---------- topbar ---------- */
  .topbar{
    position:sticky;
    top:env(safe-area-inset-top,0px);
    z-index:20;
    background:linear-gradient(var(--bg) 82%, transparent);
    padding:18px 0 10px;
  }
  .brand-row{
    display:flex;
    align-items:baseline;
    gap:14px;
    flex-wrap:wrap;
    padding-bottom:12px;
  }
  .brand{
    font-family:var(--display);
    font-size:clamp(30px,5vw,42px);
    letter-spacing:0.5px;
    color:#F5D021;
    text-transform:lowercase;
    line-height:1;
    white-space:nowrap;
  }
  .brand-sub{
    font-family:var(--mono);
    font-size:12px;
    color:var(--ink-mute);
    text-transform:uppercase;
    letter-spacing:1.2px;
  }

  .stats-row{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:2px 2px 12px;
    scrollbar-width:thin;
  }
  .stat-tab{
    flex:0 0 auto;
    background:var(--bg-raised);
    border:1px solid var(--line);
    border-radius:8px;
    padding:7px 12px;
    display:flex;
    flex-direction:column;
    gap:2px;
    min-width:86px;
  }
  .stat-tab .n{
    font-family:var(--mono);
    font-weight:700;
    font-size:16px;
    color:var(--ink);
  }
  .stat-tab .l{
    font-size:10px;
    letter-spacing:0.6px;
    text-transform:uppercase;
    color:var(--ink-mute);
  }

  .search-row{
    display:flex;
    gap:10px;
    align-items:center;
  }
  .search-box{
    flex:1 1 auto;
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--bg-raised);
    border:1px solid var(--line);
    border-radius:8px;
    padding:9px 12px;
  }
  .search-box svg{ flex:0 0 auto; opacity:0.6; }
  .search-box input{
    flex:1;
    background:none;
    border:none;
    outline:none;
    color:var(--ink);
    font-family:var(--body);
    font-size:14px;
  }
  .search-box input::placeholder{ color:var(--ink-mute); }
  .clear-btn{
    background:none;
    border:1px solid var(--line);
    color:var(--ink-dim);
    border-radius:8px;
    padding:9px 12px;
    font-size:12px;
    letter-spacing:0.4px;
    text-transform:uppercase;
    cursor:pointer;
    white-space:nowrap;
  }
  .clear-btn:hover{ border-color:var(--accent); color:var(--ink); }

  /* ---------- timeline ---------- */
  .timeline-wrap{
    margin:6px 0 18px;
  }
  .timeline-label{
    font-family:var(--mono);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1px;
    color:var(--ink-mute);
    margin-bottom:6px;
    display:flex;
    justify-content:space-between;
  }
  .timeline-scroll{
    overflow-x:auto;
    padding-bottom:4px;
  }
  .timeline{
    display:flex;
    align-items:flex-end;
    gap:2px;
    height:64px;
    min-width:640px;
  }
  .decade-band{
    display:flex;
    align-items:flex-end;
    gap:2px;
    padding:0 3px 0 3px;
    border-left:1px dashed var(--line);
    position:relative;
  }
  .decade-band:first-child{ border-left:none; }
  .decade-tag{
    position:absolute;
    top:-18px;
    left:4px;
    font-family:var(--mono);
    font-size:10px;
    color:var(--ink-mute);
    letter-spacing:0.5px;
  }
  .yearbar{
    flex:1 0 10px;
    min-width:10px;
    display:flex;
    align-items:flex-end;
    cursor:pointer;
    position:relative;
  }
  .yearbar .fill{
    width:100%;
    background:var(--line);
    border-radius:2px 2px 0 0;
    transition:background 0.12s ease;
  }
  .yearbar:hover .fill{ background:var(--ink-mute); }
  .yearbar.active .fill{ background:var(--accent); }
  .yearbar .yr{
    position:absolute;
    bottom:-16px;
    left:50%;
    transform:translateX(-50%);
    font-family:var(--mono);
    font-size:9px;
    color:var(--ink-mute);
    white-space:nowrap;
  }
  .yearbar.active .yr{ color:var(--accent); }

  /* ---------- filters ---------- */
  .filter-row{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin:14px 0 12px;
  }
  .chip{
    background:var(--bg-raised);
    border:1px solid var(--line);
    color:var(--ink-dim);
    border-radius:100px;
    padding:6px 13px;
    font-size:12px;
    letter-spacing:0.3px;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:6px;
    white-space:nowrap;
  }
  .chip:hover{ border-color:var(--ink-mute); color:var(--ink); }
  .chip.on{
    background:var(--accent);
    border-color:var(--accent);
    color:var(--accent-ink);
    font-weight:600;
  }
  .chip.on.st-confirmed{ background:var(--status-confirmed); border-color:var(--status-confirmed); }
  .chip.on.st-tentative{ background:var(--status-tentative); border-color:var(--status-tentative); color:var(--bg); }
  .chip.on.setlist{ background:var(--gold); border-color:var(--gold); color:var(--gold-ink); }
  .chip .dot{ width:7px; height:7px; border-radius:50%; background:var(--ink-mute); }
  .chip .dot.setlist{ background:var(--gold); }
  .chip .dot.st-locked{ background:var(--status-locked); }
  .chip .dot.st-confirmed{ background:var(--status-confirmed); }
  .chip .dot.st-tentative{ background:var(--status-tentative); box-shadow:0 0 0 1px var(--line) inset; }
  .chip.on .dot{ background:currentColor; box-shadow:none; }

  /* ---------- layout ---------- */
  .layout{
    display:grid;
    grid-template-columns:minmax(280px,380px) 1fr;
    gap:22px;
    align-items:start;
  }
  @media (max-width:860px){
    .layout{ grid-template-columns:1fr; }
  }

  .list-count{
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-mute);
    text-transform:uppercase;
    letter-spacing:0.8px;
    margin-bottom:8px;
  }
  .list{

<script>
(function(){
  "use strict";
  var RAW = JSON.parse(document.getElementById('show-data').textContent);
  var SHOWS = RAW.shows;
  var byId = {};
  SHOWS.forEach(function(s){ byId[s.id] = s; });

  var MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];

  function fmtDate(s){
    if(s.datePrecision === 'day'){
      var p = s.date.split('-');
      var y = p[0], m = parseInt(p[1],10)-1, d = parseInt(p[2],10);
      return MONTHS[m] + ' ' + d + ', ' + y;
    }
    if(s.datePrecision === 'year'){ return 'circa ' + s.year; }
    return s.origDate;
  }
  function fmtDateShort(s){
    if(s.datePrecision === 'day'){
      var p = s.date.split('-');
      var m = parseInt(p[1],10)-1, d = parseInt(p[2],10);
      return MONTHS[m] + ' ' + d + '\n' + p[0];
    }
    return String(s.year);
  }

  /* ---------- aggregates ---------- */
  var years = SHOWS.map(function(s){ return s.year; });
  var minYear = Math.min.apply(null, years);
  var maxYear = Math.max.apply(null, years);
  document.getElementById('brandSub').textContent = '— an archive of every show, ' + minYear + '–' + maxYear;
  var countsByYear = {};
  for(var y = minYear; y <= maxYear; y++){ countsByYear[y] = 0; }
  SHOWS.forEach(function(s){ countsByYear[s.year] = (countsByYear[s.year]||0) + 1; });
  var maxCount = Math.max.apply(null, Object.keys(countsByYear).map(function(k){ return countsByYear[k]; }));

  var artistCount = {}, venueCount = {}, allArtistCount = {};
  SHOWS.forEach(function(s){
    artistCount[s.headliner] = (artistCount[s.headliner]||0) + 1;
    venueCount[s.venue] = (venueCount[s.venue]||0) + 1;
    allArtistCount[s.headliner] = (allArtistCount[s.headliner]||0) + 1;
    (s.openers||[]).forEach(function(o){ allArtistCount[o] = (allArtistCount[o]||0) + 1; });
  });
  var topArtist = Object.keys(artistCount).reduce(function(a,b){ return artistCount[b] > artistCount[a] ? b : a; });
  var setlistCount = SHOWS.filter(function(s){ return s.hasSetlist; }).length;

  var stateSet = {}, citySet = {};
  SHOWS.forEach(function(s){
    var st = (s.state || '').split(',')[0].trim();
    if(st) stateSet[st] = true;
    if(s.city) citySet[s.city.trim() + '|' + st] = true;
  });
  var stateCount = Object.keys(stateSet).length;
  var cityCount = Object.keys(citySet).length;
  var VENUES = RAW.venues || [];

  /* ---------- state ---------- */
  var state = {
    query: '',
    year: null,
    onlySetlist: false,
    status: null,
    selectedId: null,
    view: { type: 'all', value: null },
    mode: 'list'
  };

  /* ---------- this week in history ---------- */
  function renderWeekWidget(){
    var el = document.getElementById('weekWidget');
    var now = new Date();
    var dow = now.getDay(); // 0 = Sun
    var monday = new Date(now);
    monday.setDate(now.getDate() - ((dow + 6) % 7));
    var keys = {};
    var order = [];
    for(var i = 0; i < 7; i++){
      var d = new Date(monday);
      d.setDate(monday.getDate() + i);
      var key = (d.getMonth()+1) + '-' + d.getDate();
      keys[key] = true;
      order.push(key);
    }
    var matches = SHOWS.filter(function(s){
      if(s.datePrecision !== 'day') return false;
      var p = s.date.split('-');
      var key = parseInt(p[1],10) + '-' + parseInt(p[2],10);
      return keys[key];
    }).sort(function(a,b){
      var pa = a.date.split('-'), pb = b.date.split('-');
      var ka = order.indexOf(parseInt(pa[1],10)+'-'+parseInt(pa[2],10));
      var kb = order.indexOf(parseInt(pb[1],10)+'-'+parseInt(pb[2],10));
      if(ka !== kb) return ka - kb;
      return b.year - a.year;
    });

    var sunday = new Date(monday);
    sunday.setDate(monday.getDate() + 6);
    var head = '<div class="week-widget-head">This week in concert history</div>';
    if(!matches.length){
      var rangeStr = MONTHS[monday.getMonth()] + ' ' + monday.getDate() + '–' + MONTHS[sunday.getMonth()] + ' ' + sunday.getDate();
      el.innerHTML = head + '<div class="week-widget-empty">No shows logged for this week (' + rangeStr + ') — yet.</div>';
      return;
    }
    var itemsHtml = matches.map(function(s){
      var p = s.date.split('-');
      var short = MONTHS[parseInt(p[1],10)-1] + ' ' + parseInt(p[2],10);
      return '<button class="week-item" data-id="'+s.id+'" type="button">' +
        '<span class="wyear tabular">'+short+', '+s.year+'</span>' +
        '<span class="wartist">'+esc(s.headliner)+'</span>' +
        '<span class="wvenue">'+esc(s.venue)+' • '+esc(s.city)+'</span>' +
      '</button>';
    }).join('');
    el.innerHTML = head + '<div class="week-list">' + itemsHtml + '</div>';
    el.querySelectorAll('.week-item').forEach(function(btn){
      btn.addEventListener('click', function(){
        setMode('list');
        state.view = {type:'all', value:null};
        state.year = null;
        state.selectedId = btn.getAttribute('data-id');
        render();
        document.getElementById('detail').scrollIntoView({behavior:'smooth', block:'start'});
      });
    });
  }

  /* ---------- stats row ---------- */
  function renderStats(){
    var el = document.getElementById('statsRow');
    var items = [
      [String(SHOWS.length), 'shows logged'],
      [String(Object.keys(allArtistCount).length), 'artists'],
      [String(Object.keys(venueCount).length), 'venues'],
      [(maxYear - minYear + 1) + ' yrs', minYear + '–' + maxYear],
      [Math.round(setlistCount/SHOWS.length*100) + '%', 'w/ setlist'],
      [String(stateCount), 'states'],
      [String(cityCount), 'cities']
    ];
    el.innerHTML = items.map(function(it){
      return '<div class="stat-tab"><span class="n tabular">'+esc(it[0])+'</span><span class="l">'+esc(it[1])+'</span></div>';
    }).join('');
  }

  /* ---------- timeline ---------- */
  function decadeOf(y){ return Math.floor(y/10)*10; }
  function renderTimeline(){
    var el = document.getElementById('timeline');
    var html = '';
    var curDecade = null;
    for(var y = minYear; y <= maxYear; y++){
      var d = decadeOf(y);
      if(d !== curDecade){
        if(curDecade !== null) html += '</div>';
        html += '<div class="decade-band"><span class="decade-tag">' + d + 's</span>';
        curDecade = d;
      }
      var c = countsByYear[y];
      var h = c === 0 ? 3 : Math.max(6, Math.round(c/maxCount*46));
      var showLabel = (y % 5 === 0) || y === minYear || y === maxYear;
      var active = state.year === y ? ' active' : '';
      html += '<div class="yearbar'+active+'" data-year="'+y+'" title="'+y+': '+c+' show'+(c===1?'':'s')+'">' +
                '<div class="fill" style="height:'+h+'px"></div>' +
                (showLabel ? '<span class="yr">'+y+'</span>' : '') +
              '</div>';
    }
    html += '</div>';
    el.innerHTML = html;
    el.querySelectorAll('.yearbar').forEach(function(bar){
      bar.addEventListener('click', function(){
        var y = parseInt(bar.getAttribute('data-year'),10);
        state.year = (state.year === y) ? null : y;
        state.selectedId = null;
        render();
      });
    });
  }

  /* ---------- filter chips ---------- */
  function renderFilters(){
    var el = document.getElementById('filterRow');
    var chips = [
      {key:'setlist', label:'Has setlist', on: state.onlySetlist},
      {key:'st-locked', label:'Locked In', on: state.status === 'Locked In'},
      {key:'st-confirmed', label:'Confirmed', on: state.status === 'Confirmed'},
      {key:'st-tentative', label:'Tentative', on: state.status === 'Tentative'}
    ];
    el.innerHTML = chips.map(function(c){
      return '<button class="chip '+c.key+(c.on?' on':'')+'" data-key="'+c.key+'" type="button">'+
             '<span class="dot '+c.key+'"></span>' + esc(c.label) + '</button>';
    }).join('');
    el.querySelectorAll('.chip').forEach(function(btn){
      btn.addEventListener('click', function(){
        var k = btn.getAttribute('data-key');
        if(k === 'setlist'){ state.onlySetlist = !state.onlySetlist; }
        else{
          var map = {'st-locked':'Locked In','st-confirmed':'Confirmed','st-tentative':'Tentative'};
          var val = map[k];
          state.status = (state.status === val) ? null : val;
        }
        render();
      });
    });
  }

  /* ---------- filtering ---------- */
  function matchesQuery(s, q){
    if(!q) return true;
    q = q.toLowerCase();
    return (s.headliner + ' ' + s.venue + ' ' + s.city + ' ' + (s.tour||'') + ' ' + s.openers.join(' '))
      .toLowerCase().indexOf(q) !== -1;
  }
  function matchingOpeners(s, q){
    if(!q) return [];
    q = q.toLowerCase();
    return (s.openers||[]).filter(function(o){ return o.toLowerCase().indexOf(q) !== -1; });
  }
  function dateSortKey(s){
    // Year-only entries ('1994') sort as Jan 1 of that year so they still
    // land in the right chronological neighborhood among full dates.
    return s.date.length === 4 ? s.date + '-01-01' : s.date;
  }
  function currentList(){
    var items = SHOWS.filter(function(s){
      if(state.view.type === 'artist' && s.headliner !== state.view.value) return false;
      if(state.view.type === 'venue' && s.vkey !== state.view.value) return false;
      if(state.year !== null && s.year !== state.year) return false;
      if(state.onlySetlist && !s.hasSetlist) return false;
      if(state.status && s.status !== state.status) return false;
      if(!matchesQuery(s, state.query)) return false;
      return true;
    });
    items.sort(function(a,b){
      var ka = dateSortKey(a), kb = dateSortKey(b);
      if(ka < kb) return -1;
      if(ka > kb) return 1;
      return a.id < b.id ? -1 : a.id > b.id ? 1 : 0;
    });
    return items;
  }

  /* ---------- list ---------- */
  function renderList(){
    var items = currentList();
    document.getElementById('listCount').textContent = items.length + ' show' + (items.length===1?'':'s') +
      (state.view.type !== 'all' ? ' — ' + (state.view.label || state.view.value) : '');
    var el = document.getElementById('list');
    if(items.length === 0){
      el.innerHTML = '<div class="empty-note">No shows match. Try clearing a filter.</div>';
      return;
    }
    el.innerHTML = items.map(function(s){
      var sel = s.id === state.selectedId ? ' selected' : '';
      var openerHit = matchingOpeners(s, state.query);
      var openerHtml = openerHit.length
        ? '<span class="ropener">with <b>'+esc(openerHit.join(', '))+'</b></span>'
        : '';
      return '<button class="row'+sel+'" data-id="'+s.id+'" type="button">' +
        '<span class="rdate tabular">'+esc(fmtDateShort(s)).replace('\n','<br>')+'</span>' +
        '<span class="rmain">' +
          '<span class="rartist">'+esc(s.headliner)+'</span>' +
          '<span class="rvenue">'+esc(s.venue)+' • '+esc(s.city)+'</span>' +
          openerHtml +
        '</span>' +
        '<span class="rmark">'+
          '<span class="rstatus-dot '+statusClass(s.status)+'" title="Status: '+esc(s.status)+'"></span>'+
          (s.hasSetlist ? '<span class="has" title="Setlist on file">&#9679;</span>' : '<span class="no" title="No setlist on file">&#9675;</span>')+
          ((s.images && s.images.length) ? '<span class="has" title="'+s.images.length+' photo'+(s.images.length===1?'':'s')+' on file">&#9642;</span>' : '')+
        '</span>' +
      '</button>';
    }).join('');
    el.querySelectorAll('.row').forEach(function(row){
      row.addEventListener('click', function(){
        state.selectedId = row.getAttribute('data-id');
        render();
        if(window.innerWidth <= 860){
          document.getElementById('detail').scrollIntoView({behavior:'smooth', block:'start'});
        }
      });
    });
  }

  /* ---------- detail: ticket ---------- */
  function statusClass(st){
    if(st === 'Locked In') return 'st-locked';
    if(st === 'Confirmed') return 'st-confirmed';
    return 'st-tentative';
  }
  function renderTicket(s){
    var fields = [
      ['Date', esc(fmtDate(s))],
      ['Venue', esc(s.venue), 'venue'],
      ['City', esc(s.city + (s.state ? ', ' + s.state : ''))],
      ['Status', esc(s.status)]
    ];
    var fieldsHtml = fields.map(function(f){
      var linkCls = f[2] ? ' link' : '';
      var dataAttr = f[2] ? ' data-pivot="venue" data-val="'+esc(s.vkey)+'" data-label="'+esc(s.venueCanonName)+'"' : '';
      return '<div class="field"><div class="flabel">'+f[0]+'</div><div class="fval'+linkCls+'"'+dataAttr+'>'+f[1]+'</div></div>';
    }).join('');

    var supportHtml = s.openers.length
      ? '<div class="support-line">Support: <b>'+esc(s.openers.join(', '))+'</b></div>'
      : '';

    var stubHtml = (s.images && s.images.length)
      ? '<div class="stub-photo-wrap">' + s.images.map(function(src, i){
          var cap = s.images.length > 1 ? 'Photo ' + (i+1) + ' of ' + s.images.length : 'Original stub';
          return '<div class="stub-photo" data-show="'+s.id+'" data-idx="'+i+'"><img src="'+esc(src)+'" alt="Show photo '+(i+1)+'"><div class="stub-photo-cap">'+cap+'</div></div>';
        }).join('') + '</div>'
      : '';

    var bodyHtml;
    if(s.hasSetlist){
      var lastWasEncoreNote = false;
      var songsHtml = s.setlist.map(function(song){
        var enc = /encore/i.test(song.note||'');
        var noteHtml = '';
        if(song.note){
          noteHtml = '<div class="set-note">'+esc(song.note)+'</div>';
        }
        return noteHtml + '<div class="song'+(enc?' enc':'')+'"><span class="pos tabular">'+esc(song.pos)+'</span><span class="title">'+esc(song.title)+'</span></div>';
      }).join('');
      bodyHtml = '<div class="btitle">Setlist — '+s.setlist.length+' songs on file</div><div class="setlist">'+songsHtml+'</div>';
    } else {
      bodyHtml = '<div class="btitle">Setlist</div><div class="no-setlist">No setlist on file for this show yet.</div>';
    }

    var notesHtml = s.notes ? '<div class="notes-block"><span class="nlabel">Notes</span>'+esc(s.notes)+'</div>' : '';

    return (
      '<div class="ticket">' +
        '<div class="ticket-head">' +
          '<div class="ticket-status '+statusClass(s.status)+'">'+esc(s.status)+'</div>' +
          '<div class="eyebrow">'+(s.tour ? esc(s.tour) : 'Admit one')+'</div>' +
          '<div class="headliner" data-pivot="artist" data-val="'+esc(s.headliner)+'">'+esc(s.headliner)+'</div>' +
          (s.album ? '<div class="tourname">In support of <em>'+esc(s.album)+'</em></div>' : '') +
          '<div class="ticket-fields">'+fieldsHtml+'</div>' +
          stubHtml +
          supportHtml +
          notesHtml +
        '</div>' +
        '<div class="perf"></div>' +
        '<div class="ticket-body">'+bodyHtml+'</div>' +
      '</div>'
    );
  }

  function renderAggregate(){
    var type = state.view.type, val = state.view.value, label = state.view.label || val;
    var list = SHOWS.filter(function(s){ return type === 'artist' ? s.headliner === val : s.vkey === val; });
    var yrs = list.map(function(s){ return s.year; });
    var span = yrs.length ? (Math.min.apply(null,yrs) + '–' + Math.max.apply(null,yrs)) : '—';
    var withSet = list.filter(function(s){ return s.hasSetlist; }).length;
    var kicker = type === 'artist' ? 'Artist' : 'Venue';
    var extra = type === 'artist'
      ? (function(){ var vs = {}; list.forEach(function(s){ vs[s.venue]=1; }); return Object.keys(vs).length + ' venue' + (Object.keys(vs).length===1?'':'s'); })()
      : (function(){ var as = {}; list.forEach(function(s){ as[s.headliner]=1; }); return Object.keys(as).length + ' act' + (Object.keys(as).length===1?'':'s'); })();

    return (
      '<button class="back-link" id="backBtn" type="button">&larr; all shows</button>' +
      '<div class="agg-head">' +
        '<div class="agg-kicker">'+kicker+'</div>' +
        '<div class="agg-title">'+esc(label)+'</div>' +
        '<div class="agg-meta">' +
          '<span><b class="tabular">'+list.length+'</b> time'+(list.length===1?'':'s')+' seen</span>' +
          '<span>'+esc(span)+'</span>' +
          '<span>'+esc(extra)+'</span>' +
          '<span><b class="tabular">'+withSet+'</b>/'+list.length+' with setlist</span>' +
        '</div>' +
      '</div>'
    );
  }

  function renderDetail(){
    var el = document.getElementById('detail');
    var html = '';
    if(state.view.type !== 'all'){
      html += renderAggregate();
    }
    if(state.selectedId && byId[state.selectedId]){
      html += renderTicket(byId[state.selectedId]);
    } else if(state.view.type === 'all'){
      html += '<div class="idle">' +
        '<div class="idle-head">Pick a show</div>' +
        '<p>Scrub the timeline, search, or filter, then click any show on the left to pull its ticket.</p>' +
        '</div>';
    }
    el.innerHTML = html;

    var back = document.getElementById('backBtn');
    if(back){ back.addEventListener('click', function(){ state.view = {type:'all', value:null}; render(); }); }

    el.querySelectorAll('[data-pivot]').forEach(function(node){
      node.addEventListener('click', function(){
        var type = node.getAttribute('data-pivot');
        var val = node.getAttribute('data-val');
        var label = node.getAttribute('data-label');
        state.view = { type: type, value: val, label: label || val };
        state.year = null;
        render();
      });
    });

    el.querySelectorAll('.stub-photo').forEach(function(node){
      node.addEventListener('click', function(){
        var showId = node.getAttribute('data-show');
        var idx = parseInt(node.getAttribute('data-idx'), 10) || 0;
        openLightbox(showId, idx);
      });
    });
  }

  var lbState = { showId: null, idx: 0 };
  function openLightbox(showId, idx){
    var s = byId[showId];
    if(!s || !s.images || !s.images.length) return;
    lbState.showId = showId;
    lbState.idx = idx;
    renderLightbox();
    document.getElementById('stubLightbox').classList.remove('hidden');
  }
  function renderLightbox(){
    var s = byId[lbState.showId];
    if(!s) return;
    var n = s.images.length;
    document.getElementById('stubLightboxImg').src = s.images[lbState.idx];
    document.getElementById('lbCounter').textContent = n > 1 ? (lbState.idx+1) + ' / ' + n : '';
    document.getElementById('lbPrev').classList.toggle('hidden', n <= 1);
    document.getElementById('lbNext').classList.toggle('hidden', n <= 1);
  }

  function esc(str){
    return String(str==null?'':str).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function render(){
    renderWeekWidget();
    renderTimeline();
    renderFilters();
    renderList();
    renderDetail();
  }

  /* ---------- map view ---------- */
  var map = null, mapInited = false;
  function statusColor(st){
    if(st === 'Locked In') return getCss('--status-locked');
    if(st === 'Confirmed') return getCss('--status-confirmed');
    return getCss('--status-tentative');
  }
  function getCss(varName){
    return getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
  }
  function initMap(){
    if(mapInited || typeof L === 'undefined' || !VENUES.length) return;
    mapInited = true;
    map = L.map('mapEl', { scrollWheelZoom: true });
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri',
      maxZoom: 16
    }).addTo(map);

    var bounds = [];
    VENUES.forEach(function(v){
      var radius = Math.max(6, Math.min(22, 5 + Math.sqrt(v.count) * 4));
      var marker = L.circleMarker([v.lat, v.lon], {
        radius: radius,
        color: getCss('--accent'),
        weight: 2,
        fillColor: getCss('--accent'),
        fillOpacity: 0.55
      }).addTo(map);
      var popupId = 'mp-' + Math.random().toString(36).slice(2);
      marker.bindPopup(
        '<div class="map-popup" id="'+popupId+'">' +
          '<div class="mp-venue">'+esc(v.venue)+'</div>' +
          '<div class="mp-city">'+esc(v.city)+', '+esc(v.state)+' — '+v.count+' show'+(v.count===1?'':'s')+'</div>' +
          '<button type="button" data-venue="'+esc(v.vkey)+'" data-label="'+esc(v.venue)+'">View shows</button>' +
        '</div>'
      );
      marker.on('popupopen', function(){
        var btn = document.querySelector('#'+popupId+' button');
        if(btn){
          btn.addEventListener('click', function(){
            state.view = { type: 'venue', value: btn.getAttribute('data-venue'), label: btn.getAttribute('data-label') };
            state.year = null;
            state.selectedId = null;
            setMode('list');
            render();
          });
        }
      });
      bounds.push([v.lat, v.lon]);
    });
    if(bounds.length){ map.fitBounds(bounds, { padding: [24,24] }); }
    setTimeout(function(){ map.invalidateSize(); }, 60);
  }
  function setMode(mode){
    state.mode = mode;
    document.getElementById('listLayout').hidden = (mode !== 'list');
    document.getElementById('mapView').hidden = (mode !== 'map');
    document.getElementById('mapLegend').hidden = (mode !== 'map');
    document.querySelectorAll('#viewToggle button').forEach(function(b){
      b.classList.toggle('on', b.getAttribute('data-view') === mode);
    });
    if(mode === 'map'){
      initMap();
      setTimeout(function(){ if(map) map.invalidateSize(); }, 30);
    }
  }

  document.getElementById('searchInput').addEventListener('input', function(e){
    state.query = e.target.value;
    if(state.query.trim() !== ''){
      // Typing a search term means "search everything" -- don't silently
      // stay scoped to whatever artist/venue pivot the user last clicked into.
      state.view = {type:'all', value:null};
    }
    render();
  });
  document.getElementById('resetBtn').addEventListener('click', function(){
    state.query = ''; state.year = null; state.onlySetlist = false; state.status = null;
    state.selectedId = null; state.view = {type:'all', value:null};
    document.getElementById('searchInput').value = '';
    render();
  });

  document.getElementById('stubLightbox').addEventListener('click', function(){
    this.classList.add('hidden');
    document.getElementById('stubLightboxImg').src = '';
  });

  document.getElementById('lbPrev').addEventListener('click', function(e){
    e.stopPropagation();
    var s = byId[lbState.showId];
    if(!s) return;
    lbState.idx = (lbState.idx - 1 + s.images.length) % s.images.length;
    renderLightbox();
  });
  document.getElementById('lbNext').addEventListener('click', function(e){
    e.stopPropagation();
    var s = byId[lbState.showId];
    if(!s) return;
    lbState.idx = (lbState.idx + 1) % s.images.length;
    renderLightbox();
  });
  document.addEventListener('keydown', function(e){
    var lb = document.getElementById('stubLightbox');
    if(lb.classList.contains('hidden')) return;
    if(e.key === 'Escape'){ lb.classList.add('hidden'); document.getElementById('stubLightboxImg').src=''; }
    else if(e.key === 'ArrowLeft'){ document.getElementById('lbPrev').click(); }
    else if(e.key === 'ArrowRight'){ document.getElementById('lbNext').click(); }
  });

  document.querySelectorAll('#viewToggle button').forEach(function(btn){
    btn.addEventListener('click', function(){
      setMode(btn.getAttribute('data-view'));
    });
  });

  renderStats();
  render();
})();
</script>
